<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 440px; height: 280px; overflow: hidden;
        background: #14161a; color: #f4f5f7;
        font: 400 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column; justify-content: center;
        padding: 36px;
      }
      .wordmark { font-size: 34px; letter-spacing: -0.02em; margin-bottom: 14px; }
      .wordmark b { font-weight: 800; }
      .wordmark span { color: #8b8cf7; font-weight: 400; }
      .tag { font-size: 17px; color: #c9cdd6; max-width: 340px; }
      .demo { margin-top: 18px; font-size: 15px; color: #6b7280; font-family: Georgia, serif; }
      .demo b { color: #f4f5f7; font-weight: 700; }
      .chips { display: flex; gap: 8px; margin-top: 18px; }
      .chip {
        font-size: 12px; color: #c9cdd6; border: 1px solid #252a31;
        border-radius: 999px; padding: 4px 10px;
      }
    </style>
  </head>
  <body>
    <p class="wordmark"><b>Bi</b>onic <b>Pa</b>ge</p>
    <p class="tag">Turn any page into a bionic reading page.</p>
    <p class="demo"><b>A fix</b>ation <b>point</b> gives <b>the</b> eye <b>a</b> place <b>to</b> land.</p>
    <div class="chips">
      <span class="chip">5 modes</span>
      <span class="chip">Per-site</span>
      <span class="chip">Reversible</span>
      <span class="chip">No tracking</span>
    </div>
  </body>
</html>
