<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1400px; height: 560px; overflow: hidden;
        background: #14161a; color: #f4f5f7;
        font: 400 22px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column; justify-content: center;
        padding: 80px 96px;
        position: relative;
      }
      body::after {
        content: ""; position: absolute; right: -120px; top: -120px;
        width: 520px; height: 520px; border-radius: 50%;
        background: #1c2033;
      }
      .wordmark { font-size: 64px; letter-spacing: -0.03em; margin-bottom: 22px; z-index: 1; }
      .wordmark b { font-weight: 800; }
      .tag { font-size: 30px; color: #c9cdd6; max-width: 820px; z-index: 1; }
      .demo { margin-top: 30px; font-size: 26px; color: #6b7280; font-family: Georgia, serif; z-index: 1; }
      .demo b { color: #f4f5f7; font-weight: 700; }
      .chips { display: flex; gap: 12px; margin-top: 34px; z-index: 1; }
      .chip { font-size: 18px; color: #c9cdd6; border: 1px solid #252a31; border-radius: 999px; padding: 8px 18px; }
    </style>
  </head>
  <body>
    <p class="wordmark"><b>Bi</b>onic <b>Pa</b>ge</p>
    <p class="tag">Turn any web page into a bionic reading page.</p>
    <p class="demo"><b>A fix</b>ation <b>point</b> gives <b>the</b> eye <b>a</b> stable <b>place</b> to <b>land</b>.</p>
    <div class="chips">
      <span class="chip">Five modes</span>
      <span class="chip">Per-site control</span>
      <span class="chip">Fully reversible</span>
      <span class="chip">No network, no tracking</span>
    </div>
  </body>
</html>
