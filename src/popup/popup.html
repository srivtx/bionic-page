<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Bionic Page</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup" aria-label="Bionic Page controls">
      <header class="popup__header">
        <span class="wordmark" role="img" aria-label="Bionic Page">
          <b class="wordmark__head">Bi</b><span class="wordmark__tail">onic</span>
          <span class="wordmark__gap" aria-hidden="true"> </span>
          <b class="wordmark__head">Pa</b><span class="wordmark__tail">ge</span>
        </span>

        <label class="switch">
          <input
            type="checkbox"
            id="enabled"
            role="switch"
            aria-label="Enable Bionic Page"
          />
          <span class="switch__track" aria-hidden="true">
            <span class="switch__thumb"></span>
          </span>
        </label>
      </header>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div class="field">
        <label class="field__label" for="mode">Mode</label>
        <select id="mode" class="control control--select"></select>
        <p id="modeDescription" class="hint"></p>
      </div>

      <div class="field">
        <div class="field__row">
          <label class="field__label" for="intensity">Intensity</label>
          <output id="intensityValue" class="value" for="intensity">50%</output>
        </div>
        <input
          type="range"
          id="intensity"
          class="control control--range"
          min="0.2"
          max="0.9"
          step="0.05"
          value="0.5"
        />
      </div>

      <div class="field">
        <div class="field__row">
          <label class="field__label" for="siteEnabled">This site</label>
          <label class="switch">
            <input
              type="checkbox"
              id="siteEnabled"
              role="switch"
              aria-label="Enable Bionic Page on this site"
            />
            <span class="switch__track" aria-hidden="true">
              <span class="switch__thumb"></span>
            </span>
          </label>
        </div>
        <p id="siteHost" class="hint site__host"></p>
      </div>

      <div class="field field--row">
        <label class="field__label" for="minWordLength">Min word length</label>
        <input
          type="number"
          id="minWordLength"
          class="control control--number"
          min="2"
          max="8"
          step="1"
          inputmode="numeric"
          value="3"
        />
      </div>

      <footer class="popup__footer">
        <button type="button" id="openOptions" class="button">Options</button>
      </footer>
    </main>

    <script src="popup.js" defer></script>
  </body>
</html>
